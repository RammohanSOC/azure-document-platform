name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_aad_admin_login: ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
  TF_VAR_aad_admin_object_id: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_key_vault_admin_object_ids: ${{ secrets.KV_ADMIN_OBJECT_IDS }}

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production   # requires manual approval — configure a protection rule on this environment
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - run: terraform init

      - run: terraform apply -auto-approve
